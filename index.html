<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My GF?</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React, ReactDOM, Framer Motion from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        .playfair {
            font-family: 'Playfair Display', serif;
        }

        .montserrat {
            font-family: 'Montserrat', sans-serif;
        }

        #root {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .app-container {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #FFF1F2 0%, #FBCFE8 50%, #FECDD3 100%);
            background-size: 200% 200%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-content {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card-container {
            max-width: 42rem;
            margin: 0 auto;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border-radius: 1.5rem;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .card-glow {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 228, 230, 0.3) 0%, transparent 50%, rgba(252, 231, 243, 0.3) 100%);
            border-radius: 1.5rem;
            pointer-events: none;
        }

        .card-content {
            position: relative;
            z-index: 10;
        }

        .love-message {
            color: #881337;
            font-size: 1.125rem;
            line-height: 1.75rem;
            margin-bottom: 2.5rem;
            font-weight: 500;
        }

        .main-question {
            font-size: 3rem;
            font-weight: bold;
            color: #4c0519;
            margin-bottom: 3.5rem;
            letter-spacing: -0.025em;
            line-height: 1.1;
        }

        .buttons-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            min-height: 120px;
        }

        .yes-button {
            background: linear-gradient(to right, #E11D48, #BE123C);
            color: white;
            font-size: 1.5rem;
            padding: 1.5rem 4rem;
            border-radius: 9999px;
            border: 2px solid #FB7185;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            font-weight: bold;
            letter-spacing: 0.05em;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .yes-button:hover {
            transform: scale(1.1);
            box-shadow: 0 25px 50px -12px rgba(225, 29, 72, 0.4);
        }

        .yes-button:active {
            transform: scale(0.95);
        }

        .no-button {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            color: #9F1239;
            font-size: 1.125rem;
            padding: 1rem 2.5rem;
            border-radius: 9999px;
            border: 2px solid rgba(251, 113, 133, 0.6);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.1s ease;
        }

        .no-button:hover {
            background: rgba(255, 241, 242, 0.8);
        }

        .hover-message {
            margin-top: 2rem;
            color: #BE123C;
            font-size: 1.125rem;
            font-weight: 500;
        }

        .hearts-container {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            font-size: 2.25rem;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 1rem;
        }

        .modal-content {
            background: linear-gradient(135deg, #ffffff 0%, rgba(255, 228, 230, 0.5) 50%, #ffffff 100%);
            backdrop-filter: blur(16px);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 48rem;
            width: 100%;
            padding: 3.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .corner-heart {
            position: absolute;
            color: #F43F5E;
            width: 2.5rem;
            height: 2.5rem;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .corner-sparkle {
            position: absolute;
            color: #FB7185;
            width: 2rem;
            height: 2rem;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .bouquet-container {
            margin-bottom: 2.5rem;
            position: relative;
        }

        .bouquet-image {
            width: 100%;
            height: 24rem;
            object-fit: cover;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 4px solid rgba(255, 255, 255, 0.8);
        }

        .thank-you-text {
            font-size: 3rem;
            font-weight: bold;
            color: #881337;
            margin-bottom: 1rem;
        }

        .heart-icon-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 5rem;
            height: 5rem;
            background: linear-gradient(135deg, #F43F5E, #EC4899);
            border-radius: 9999px;
            margin-bottom: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .heart-icon {
            width: 2.5rem;
            height: 2.5rem;
            color: white;
            fill: white;
        }

        .mmmwah-text {
            font-size: 1.875rem;
            color: #BE123C;
            font-weight: bold;
            letter-spacing: 0.025em;
        }

        .floating-hearts {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            border-radius: 1.5rem;
        }

        .floating-heart {
            position: absolute;
            font-size: 1.25rem;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.1);
            }
        }

        @media (min-width: 768px) {
            .card {
                padding: 4rem;
            }
            .love-message {
                font-size: 1.25rem;
            }
            .main-question {
                font-size: 4.5rem;
            }
            .yes-button {
                font-size: 1.5rem;
            }
            .thank-you-text {
                font-size: 3.75rem;
            }
            .mmmwah-text {
                font-size: 1.875rem;
            }
            .bouquet-image {
                height: 24rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState } = React;
        const { motion, AnimatePresence } = Motion;

        const HeartIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className="heart-icon">
                <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/>
            </svg>
        );

        const SparklesIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                <path d="M5 3v4"/>
                <path d="M19 17v4"/>
                <path d="M3 5h4"/>
                <path d="M17 19h4"/>
            </svg>
        );

        const NoButton = ({ onHover }) => {
            const [position, setPosition] = useState({ x: 0, y: 0 });
            const [isInitialized, setIsInitialized] = useState(false);

            const handleMouseEnter = (e) => {
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;
                
                const newX = Math.random() * (viewportWidth - 200) - (viewportWidth / 2 - 100);
                const newY = Math.random() * (viewportHeight - 200) - (viewportHeight / 2 - 100);
                
                setPosition({ x: newX, y: newY });
                setIsInitialized(true);
                onHover();
            };

            return (
                <motion.button
                    className="no-button"
                    onMouseEnter={handleMouseEnter}
                    onTouchStart={handleMouseEnter}
                    animate={isInitialized ? { x: position.x, y: position.y } : {}}
                    transition={{ type: "spring", stiffness: 300, damping: 20 }}
                >
                    No
                </motion.button>
            );
        };

        const SuccessModal = () => {
            return (
                <motion.div
                    className="modal-overlay"
                    initial={{ opacity: 0 }}
                    animate={{ opacity: 1 }}
                    exit={{ opacity: 0 }}
                >
                    <motion.div
                        className="modal-content"
                        initial={{ scale: 0.5, opacity: 0, y: 50 }}
                        animate={{ scale: 1, opacity: 1, y: 0 }}
                        transition={{ type: "spring", duration: 0.7, bounce: 0.4 }}
                    >
                        <div className="corner-heart" style={{ top: '1.5rem', left: '1.5rem' }}>
                            <HeartIcon />
                        </div>
                        <div className="corner-heart" style={{ top: '1.5rem', right: '1.5rem', animationDelay: '0.5s' }}>
                            <HeartIcon />
                        </div>
                        <div className="corner-sparkle" style={{ bottom: '1.5rem', left: '2.5rem', animationDelay: '1s' }}>
                            <SparklesIcon />
                        </div>
                        <div className="corner-sparkle" style={{ bottom: '1.5rem', right: '2.5rem', animationDelay: '1.5s' }}>
                            <SparklesIcon />
                        </div>

                        

                        <motion.h1
                            className="thank-you-text playfair"
                            initial={{ y: 20, opacity: 0 }}
                            animate={{ y: 0, opacity: 1 }}
                            transition={{ delay: 0.4 }}
                        >
                            THANK YOU BABY
                        </motion.h1>
                        
                        <motion.div
                            className="heart-icon-container"
                            initial={{ scale: 0 }}
                            animate={{ scale: [0, 1.2, 1] }}
                            transition={{ delay: 0.5, duration: 0.6 }}
                        >
                            <HeartIcon />
                        </motion.div>

                        <motion.p
                            className="mmmwah-text montserrat"
                            initial={{ y: 20, opacity: 0 }}
                            animate={{ y: 0, opacity: 1 }}
                            transition={{ delay: 0.6 }}
                        >
                            MMMWAH
                        </motion.p>

                        <div className="floating-hearts">
                            {Array.from({ length: 15 }).map((_, i) => (
                                <motion.div
                                    key={i}
                                    className="floating-heart"
                                    initial={{ 
                                        x: `${Math.random() * 100}%`, 
                                        y: '100%',
                                        opacity: 0,
                                        rotate: 0
                                    }}
                                    animate={{
                                        y: '-20%',
                                        opacity: [0, 1, 0],
                                        rotate: 360
                                    }}
                                    transition={{
                                        duration: 3 + Math.random() * 2,
                                        delay: Math.random() * 2,
                                        repeat: Infinity
                                    }}
                                >
                                    ❤️
                                </motion.div>
                            ))}
                        </div>
                    </motion.div>
                </motion.div>
            );
        };

        function App() {

            const [showSuccess, setShowSuccess] = useState(false);
            const [noButtonHovers, setNoButtonHovers] = useState(0);

            const triggerConfetti = () => {
                const duration = 3000;
                const end = Date.now() + duration;
                const colors = ['#E11D48', '#FB7185', '#FFE4E6', '#FFF1F2', '#FF69B4'];

                const frame = () => {
                    confetti({
                        particleCount: 8,
                        angle: 60,
                        spread: 80,
                        origin: { x: 0, y: 0.8 },
                        colors: colors,
                        shapes: ['circle', 'square'],
                        gravity: 0.8,
                        scalar: 1.0
                    });
                    confetti({
                        particleCount: 8,
                        angle: 120,
                        spread: 80,
                        origin: { x: 1, y: 0.8 },
                        colors: colors,
                        shapes: ['circle', 'square'],
                        gravity: 0.8,
                        scalar: 1.0
                    });
                    confetti({
                        particleCount: 10,
                        angle: 90,
                        spread: 100,
                        origin: { x: 0.5, y: 0.6 },
                        colors: colors,
                        shapes: ['circle', 'square'],
                        gravity: 0.6,
                        scalar: 1.2
                    });

                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                };

                frame();
            };

           const handleYesClick = async () => {
    await fetch("https://formspree.io/f/xdawglpq", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            answer: "YES"
        })
    });

    triggerConfetti();
    setTimeout(() => {
        setShowSuccess(true);
    }, 500);
};

            const handleNoHover = () => {
                setNoButtonHovers(prev => prev + 1);
            };

            return (
                <div className="app-container">
                    <div className="background" />

                    <div className="main-content">
                        <div className="card-container">
                            <motion.div
                                className="card"
                                initial={{ y: 50, opacity: 0 }}
                                animate={{ y: 0, opacity: 1 }}
                                transition={{ delay: 0.3, duration: 0.6 }}
                            >
                                <div className="card-glow" />
                                
                                <div className="card-content">
                                    <motion.p
                                        className="love-message montserrat"
                                        initial={{ y: 20, opacity: 0 }}
                                        animate={{ y: 0, opacity: 1 }}
                                        transition={{ delay: 0.4, duration: 0.5 }}
                                    >
                                        i love you so much and ive loved u for so long and i rly never wanna lose u  ur my favourite person ever and i cant imagine my life with someone else so plsplsplsplsplsplsplspls say yes
                                    </motion.p>

                                    <motion.h1
                                        className="main-question playfair"
                                        initial={{ scale: 0.9, opacity: 0 }}
                                        animate={{ scale: 1, opacity: 1 }}
                                        transition={{ delay: 0.5, duration: 0.5 }}
                                    >
                                        WILL YOU BE
                                        <br />
                                        MY GF?
                                    </motion.h1>

                                    <div className="buttons-container">
                                        <motion.button
                                            className="yes-button montserrat"
                                            onClick={handleYesClick}
                                            initial={{ scale: 0 }}
                                            animate={{ scale: 1 }}
                                            transition={{ delay: 0.7, type: "spring", bounce: 0.6 }}
                                            whileHover={{ scale: 1.1 }}
                                            whileTap={{ scale: 0.95 }}
                                        >
                                            YES! 💕
                                        </motion.button>

                                        <motion.div
                                            initial={{ scale: 0 }}
                                            animate={{ scale: 1 }}
                                            transition={{ delay: 0.9, type: "spring", bounce: 0.6 }}
                                        >
                                            <NoButton onHover={handleNoHover} />
                                        </motion.div>
                                    </div>

                                    {noButtonHovers > 0 && (
                                        <motion.p
                                            className="hover-message montserrat"
                                            initial={{ opacity: 0, y: 10 }}
                                            animate={{ opacity: 1, y: 0 }}
                                        >
                                            {noButtonHovers === 1 && "Come on... you know you want to say yes! 😊"}
                                            {noButtonHovers === 2 && "The button is shy! Just like my heart without you 💗"}
                                            {noButtonHovers >= 3 && "You're making this so hard! Please say yes? 🥺"}
                                        </motion.p>
                                    )}
                                </div>
                            </motion.div>

                            <div className="hearts-container">
                                {['❤️', '💕', '💖', '💝', '💗'].map((heart, i) => (
                                    <motion.div
                                        key={i}
                                        animate={{
                                            y: [0, -10, 0],
                                            rotate: [0, 10, -10, 0]
                                        }}
                                        transition={{
                                            duration: 2,
                                            delay: i * 0.2,
                                            repeat: Infinity
                                        }}
                                    >
                                        {heart}
                                    </motion.div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <AnimatePresence>
                        {showSuccess && <SuccessModal />}
                    </AnimatePresence>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
